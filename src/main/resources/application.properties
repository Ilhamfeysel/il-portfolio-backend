spring.application.name=il-portfolio-backend

gemini.api.key=${GEMINI_API_KEY}


# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Portfolio email recipient
portfolio.cv.notification-email=${CV_NOTIFICATION_EMAIL}
portfolio.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
portfolio.cv.file-path=${CV_FILE_PATH:src/main/resources/cv/Ilham_Feysel_CV.pdf}